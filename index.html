<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Youssef Hawary">
    <meta name="description" content="A responsive advanced calculator built with HTML, CSS, and JavaScript. Perform basic arithmetic operations with a clean, modern, and user-friendly interface.">
    <meta name="keywords" content="Advanced Calculator, Calculator, JavaScript Calculator, HTML, CSS, JavaScript, Responsive Calculator, Web Development, Frontend Project, Arithmetic Calculator, Calculator App">
    <meta name="robots" content="index, imageindex, archive, follow">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="calculator">

        <input
            type="text"
            id="display"
            placeholder="0"
        >

        <div class="scientific-buttons">

            <button class="math sqrt">√</button>
            <button class="math square">x²</button>
            <button class="math cube">x³</button>
            <button class="math pow">xʸ</button>
            <button class="operator">(</button>
            <button class="operator">)</button>

            <button class="math pi">π</button>
            <button class="math e">e</button>
            <button class="math abs">abs</button>
            <button class="math random">rand</button>

            <button class="math sin">sin</button>
            <button class="math cos">cos</button>
            <button class="math tan">tan</button>
            <button class="math log">log</button>

            <button class="math ln">ln</button>
            <button class="math floor">floor</button>
            <button class="math ceil">ceil</button>
            <button class="math round">round</button>

            <button class="math sign">±</button>
            <button class="math reciprocal">1/x</button>
            <button class="math factorial">x!</button>
            <button class="ans">ANS</button>

        </div>

        <div class="buttons">

            <button class="clear">AC</button>
            <button class="delete">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>

            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
            <button class="operator">*</button>

            <button class="num">4</button>
            <button class="num">5</button>
            <button class="num">6</button>
            <button class="operator">-</button>

            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
            <button class="operator">+</button>

            <button class="num">00</button>
            <button class="num">0</button>
            <button class="num">.</button>
            <button class="equal">=</button>

        </div>

    </div>

    <script src="./js/script.js"></script>

</body>
</html>
